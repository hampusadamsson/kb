name: Build

# Builds the installable artifacts for every push/PR through package.yml and, on main, attaches
# them to a rolling pre-release so there is a stable download URL for the latest build:
#   kbkan-<version>.tgz         npm tarball  ->  npm install -g ./kbkan-<version>.tgz
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # rolling pre-release

jobs:
  package:
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read

  snapshot:
    if: github.event_name != 'pull_request' && github.repository == 'hampusadamsson/kb'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Write install notes
        run: |
          version="$(node -p "require('./package.json').version")"
          {
            echo "Automated build of \`${{ github.sha }}\` (version $version)."
            echo
            echo "### npm tarball"
            echo '```sh'
            echo "npm install -g ./kbkan-${version}.tgz"
            echo '```'
            echo
            echo "Verify with \`shasum -a 256 -c SHA256SUMS.txt\`."
          } > artifacts/INSTALL.md
      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" artifacts/* \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }} ($(git rev-parse --short HEAD))" \
            --notes-file artifacts/INSTALL.md
          # keep only the newest five builds
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' | tail -n +6 \
            | xargs -r -n1 gh release delete --yes --cleanup-tag
