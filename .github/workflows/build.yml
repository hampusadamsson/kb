name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/pack-smoke.mjs
      - run: npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: kb-npm-tarball
          path: artifacts/kb-*.tgz
          if-no-files-found: error
          retention-days: 30
