name: Release Please

# Release Please keeps a release PR open on main (bump + CHANGELOG). Merging it creates the
# v<version> tag and the GitHub release. Tags created by release-please do not reliably trigger
# other workflows, so the publish job is chained here instead of relying on `push: tags`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PAT (or GitHub App token) is required: PRs opened with GITHUB_TOKEN are blocked
          # unless the repo enables "Allow GitHub Actions to create and approve pull requests",
          # and they never trigger other workflows (so CI would skip the release PR).
          # Falls back to GITHUB_TOKEN so the workflow still runs if the secret is absent.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    permissions:
      contents: write
      id-token: write
    secrets: inherit
