name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Opens/updates a "chore(main): release X.Y.Z" PR from conventional commits.
      # Merging that PR creates the v<version> tag and the GitHub release, which
      # triggers release.yml to build the tarball and publish to npm.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
