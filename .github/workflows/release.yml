name: Release

# Triggered by the v<version> tag that Release Please creates when its release PR is merged.
# Release Please already created the GitHub release; this workflow attaches the built tarball,
# checksums and publishes to npm.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish
        required: true

permissions:
  contents: write # upload release assets
  id-token: write # npm provenance

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run verify

      - name: Check the tag matches package.json
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg" ]; then
            echo "::error::tag $tag does not match package.json version $pkg"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: mkdir -p artifacts && npm pack --pack-destination artifacts
      - name: Write checksums
        working-directory: artifacts
        run: sha256sum kb-*.tgz > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kb-${{ github.event.inputs.tag || github.ref_name }}
          path: |
            artifacts/kb-*.tgz
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ env.VERSION }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --title "$TAG"
          gh release upload "$TAG" artifacts/kb-*.tgz artifacts/SHA256SUMS.txt --clobber

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set; skipping npm publish"
            exit 0
          fi
          npm publish artifacts/kb-*.tgz --provenance --access public
