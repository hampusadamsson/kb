name: Release

# Builds and publishes a released version. Called by release-please.yml when a release PR is
# merged; can also be run by hand to (re)publish an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build, e.g. v0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v0.2.0
        required: true

permissions:
  contents: write # upload release assets
  id-token: write # npm provenance

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run verify

      - name: Check the tag matches package.json
        run: |
          version="${TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg" ]; then
            echo "::error::tag $TAG does not match package.json version $pkg"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: mkdir -p artifacts && npm pack --pack-destination artifacts
      - name: Write checksums
        working-directory: artifacts
        run: sha256sum kb-*.tgz > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kb-${{ inputs.tag }}
          path: |
            artifacts/kb-*.tgz
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach assets to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --title "$TAG"
          gh release upload "$TAG" artifacts/kb-*.tgz artifacts/SHA256SUMS.txt --clobber

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set; skipping npm publish"
            exit 0
          fi
          npm publish artifacts/kb-*.tgz --provenance --access public
