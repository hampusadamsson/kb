name: Package

# Reusable packaging: builds the npm tarball and its checksum. Called by build.yml (every push)
# and release.yml (tagged releases). kb ships as an npm package only.
on:
  workflow_call:

jobs:
  npm-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack tarball
        run: mkdir -p artifacts && npm pack --pack-destination artifacts
      - name: Verify it installs and runs
        run: node scripts/pack-smoke.mjs
      - name: Write checksums
        run: cd artifacts && shasum -a 256 kbkan-*.tgz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: kb-npm-tarball
          path: |
            artifacts/kbkan-*.tgz
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
